name: Publish test and real anime ICS feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '37 0,12 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-test-pages.yml'
      - 'src/yuashie_calendar/**'
      - 'data/samples/**'
      - 'scripts/stage_sample_pages.py'
      - 'scripts/build_lifecycle_test.py'
      - 'config/lifecycle-stage.txt'
      - 'src/yuashie_calendar/anilist.py'
      - 'scripts/build_real_anime.py'
      - 'src/yuashie_calendar/season_shows.py'
      - 'tests/**'
      - 'data/real/anime-official-zh.json'
      - 'src/yuashie_calendar/zh_titles.py'
      - 'requirements*.txt'
      - 'pyproject.toml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: calendar-pages-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish test plus live anime ICS
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize latest main before generating stateful calendars
        shell: bash
        run: |
          # Older queued workflow SHAs must not publish from stale ledgers.
          # This is a fast-forward checkout of main, not a force push.
          git fetch origin main
          git checkout -B main origin/main

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Run existing calendar tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Generate explicitly fictional feeds
        env:
          PYTHONPATH: src
        run: |
          python -m yuashie_calendar \
            --input data/samples/events.json \
            --output dist/sample-calendar \
            --allow-samples

      - name: Generate isolated lifecycle test feeds
        env:
          PYTHONPATH: src
        run: python scripts/build_lifecycle_test.py

      - name: Fetch real AniList TV anime and generate separate ICS
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_real_anime.py \
            --ledger data/real/anime-events.json \
            --show-registry data/real/anime-shows.json \
            --show-snapshot dist/anime-shows-new.json \
            --zh-registry data/real/anime-zh-titles.json \
            --zh-official data/real/anime-official-zh.json \
            --zh-snapshot dist/anime-zh-titles-new.json \
            --output dist/real-anime \
            --snapshot dist/anime-events-new.json

      - name: Validate and stage public-only files
        run: python scripts/stage_sample_pages.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages-site

      - name: Deploy calendar site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist event IDs and revisions after successful deployment
        shell: bash
        run: |
          cp dist/anime-events-new.json data/real/anime-events.json
          cp dist/anime-shows-new.json data/real/anime-shows.json
          cp dist/anime-zh-titles-new.json data/real/anime-zh-titles.json
          if ! git diff --quiet -- data/real/anime-events.json data/real/anime-shows.json data/real/anime-zh-titles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/real/anime-events.json data/real/anime-shows.json data/real/anime-zh-titles.json
            git commit -m "Update bounded live anime schedule [skip ci]"
            if ! git push origin HEAD:main; then
              # Routine documentation/source commits can advance main while a
              # scheduled build is running. Rebase without force-pushing.
              # A genuine ledger conflict still fails safely instead of
              # overwriting newer IDs and SEQUENCE values.
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
